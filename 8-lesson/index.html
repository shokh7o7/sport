<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <script>
        let fruits = ["Olma", "Banan", "Mango"];

        fruits.push("Apelsin");
        console.log("push():", fruits);

        fruits = ["Olma", "Banan", "Mango"]

        fruits.pop();
        console.log("pop():", fruits);

        fruits = ["Banan", "Mango"]
    </script>
</body>
</html>
